[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movebooks-ai"
version = "0.1.0"
description = "Provider-neutral, governed accounting migration platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
agents = ["google-adk==1.39.1"]
cloud = ["cloud-sql-python-connector[pg8000]>=1.18,<2", "firebase-admin>=6.6,<8", "google-cloud-storage>=3,<4", "google-cloud-secret-manager>=2.23,<3"]
dev = ["httpx>=0.28,<1", "pytest>=9.0.3,<10", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/src/movebooks_api",
  "domain/canonical_accounting",
  "domain/discovery_assessment",
  "domain/planning_mapping",
  "domain/migration_resolution",
  "domain/validation_configuration",
  "domain/onboarding_fpu",
  "domain/reasoning",
  "agents",
  "tools/discovery",
  "tools/planning",
  "tools/mapping",
  "tools/migration",
  "tools/validation",
  "tools/configuration",
  "tools/onboarding",
  "tools/activation",
]

[tool.pytest.ini_options]
pythonpath = [".", "services/api/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
