[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movebooks-ai"
version = "0.1.0"
description = "Provider-neutral, governed accounting migration platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agents = ["google-adk>=1.17,<2"]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/src/movebooks_api",
  "domain/canonical_accounting",
  "domain/discovery_assessment",
  "domain/planning_mapping",
  "agents",
  "tools/discovery",
  "tools/planning",
  "tools/mapping",
]

[tool.pytest.ini_options]
pythonpath = [".", "services/api/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
