# Local developer profile only; no cloud credentials or durability claim.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ["127.0.0.1:8000:8080"]
    environment:
      MOVEBOOKS_ENV: local
