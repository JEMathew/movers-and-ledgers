<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="930" viewBox="0 0 1480 930"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="32" y="35" fill="#10233f" font-family="Arial" font-size="25" font-weight="700">User-triggered Gemini advisory</text><rect x="15" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="90" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">Accountant</text><line x1="90" y1="110" x2="90" y2="900" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="275" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="350" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">UI</text><line x1="350" y1="110" x2="350" y2="900" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="535" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="610" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">API</text><line x1="610" y1="110" x2="610" y2="900" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="795" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="870" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">Policy</text><line x1="870" y1="110" x2="870" y2="900" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="1055" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="1130" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">Advisor</text><line x1="1130" y1="110" x2="1130" y2="900" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="1315" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="1390" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">Gemini</text><line x1="1390" y1="110" x2="1390" y2="900" stroke="#bac9db" stroke-dasharray="5 5"/><line x1="90" y1="170" x2="350" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="138" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">1. Request explanation in</text><text x="220" y="158" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">supported context</text><line x1="350" y1="265" x2="610" y2="265" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="233" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">2. Authenticated advisory</text><text x="480" y="253" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">request</text><line x1="610" y1="360" x2="870" y2="360" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="328" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">3. Synthetic authorization,</text><text x="740" y="348" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">quota, budget, kill switch</text><line x1="870" y1="455" x2="1130" y2="455" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="423" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">4. Allowlisted synthetic</text><text x="1000" y="443" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">projection if permitted</text><line x1="1130" y1="550" x2="1390" y2="550" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="1260" y="538" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">5. Bounded ADK invocation</text><line x1="1390" y1="645" x2="1130" y2="645" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="1260" y="633" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">6. Structured untrusted output</text><line x1="1130" y1="740" x2="610" y2="740" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="870" y="728" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">7. Validate evidence references or safe fallback</text><line x1="610" y1="835" x2="90" y2="835" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="823" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">8. Advice only; no automatic workflow consumption</text></svg>