<svg xmlns="http://www.w3.org/2000/svg" width="960" height="835" viewBox="0 0 960 835"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="32" y="35" fill="#10233f" font-family="Arial" font-size="25" font-weight="700">Ambiguous account mapping</text><rect x="15" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="90" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">Accountant</text><line x1="90" y1="110" x2="90" y2="805" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="275" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="350" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">UI</text><line x1="350" y1="110" x2="350" y2="805" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="535" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="610" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">API</text><line x1="610" y1="110" x2="610" y2="805" stroke="#bac9db" stroke-dasharray="5 5"/><rect x="795" y="65" width="150" height="45" rx="5" fill="#edf4ff" stroke="#2563eb"/><text x="870" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#10233f">Mapping</text><line x1="870" y1="110" x2="870" y2="805" stroke="#bac9db" stroke-dasharray="5 5"/><line x1="90" y1="170" x2="350" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="138" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">1. Inspect 1200 Misc Clearing</text><text x="220" y="158" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">proposal</text><line x1="350" y1="265" x2="610" y2="265" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="233" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">2. Read owner-scoped proposal</text><text x="480" y="253" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">and evidence</text><line x1="610" y1="360" x2="870" y2="360" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="328" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">3. Build deterministic</text><text x="740" y="348" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">specialist proposal</text><line x1="870" y1="455" x2="350" y2="455" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="443" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">4. Evidence, uncertainty and alternatives</text><line x1="90" y1="550" x2="350" y2="550" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="518" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">5. Request advice or</text><text x="220" y="538" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">independent review</text><line x1="350" y1="645" x2="90" y2="645" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="613" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">6. Show explanation and</text><text x="220" y="633" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">findings</text><line x1="90" y1="740" x2="610" y2="740" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="728" text-anchor="middle" font-family="Arial" font-size="16" fill="#263e5c">7. Approve, reject or modify current version</text></svg>