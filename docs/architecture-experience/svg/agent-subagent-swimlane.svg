-size="23" font-weight="700" fill="#12233f">Knowledge /</text><text x="43" y="948" font-family="Arial" font-size="23" font-weight="700" fill="#12233f">governance</text><rect x="275" y="870" width="285" height="145" fill="#f8fbff" stroke="#ccd8e8"/><text x="295" y="913" font-family="Arial" font-size="22" fill="#263e5c">Versioned knowledge</text><rect x="560" y="870" width="285" height="145" fill="#f8fbff" stroke="#ccd8e8"/><text x="580" y="913" font-family="Arial" font-size="22" fill="#263e5c">Policy and evidence</text><text x="580" y="941" font-family="Arial" font-size="22" fill="#263e5c">guards</text><rect x="845" y="870" width="285" height="145" fill="#f8fbff" stroke="#ccd8e8"/><text x="865" y="913" font-family="Arial" font-size="22" fill="#263e5c">Attributable approvals</text><rect x="1130" y="870" width="285" height="145" fill="#f8fbff" stroke="#ccd8e8"/><text x="1150" y="913" font-family="Arial" font-size="22" fill="#263e5c">Bounded retry / safe stop</text><rect x="1415" y="870" width="285" height="145" fill="#f8fbff" stroke="#ccd8e8"/><text x="1435" y="913" font-family="Arial" font-size="22" fill="#263e5c">Audit; not an LLM runtime</text><text x="30" y="1065" font-family="Arial" font-size="19" fill="#50657f">Bounded synthetic Beta. Read columns left to right. Cloud and candidate activation require independent evidence.</text></svg>