<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1090" viewBox="0 0 1740 1090"><rect width="100%" height="100%" fill="#fff"/><text x="30" y="44" font-family="Arial" font-size="30" font-weight="700" fill="#12233f">Logical roles and actual execution boundaries</text><rect x="275" y="80" width="285" height="65" fill="#2563eb"/><text x="417.5" y="121" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="700">Request / context</text><rect x="560" y="80" width="285" height="65" fill="#2563eb"/><text x="702.5" y="121" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="700">Bounded proposal</text><rect x="845" y="80" width="285" height="65" fill="#2563eb"/><text x="987.5" y="121" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="700">Human decision</text><rect x="1130" y="80" width="285" height="65" fill="#2563eb"/><text x="1272.5" y="121" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="700">Execution / recovery</text><rect x="1415" y="80" width="285" height="65" fill="#2563eb"/><text x="1557.5" y="121" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="700">Evidence / outcome</text><rect x="25" y="145" width="250" height="145" fill="#edf4ff" stroke="#ccd8e8"/><text x="43" y="195" font-family="Arial" font-size="23" font-weight="700" fill="#12233f">Accountant</text><rect x="275" y="145" width="285" height="145" fill="#fff" stroke="#ccd8e8"/><text x="295" y="188" font-family="Arial" font-size="22" fill="#263e5c">Initiates journey and</text><text x="295" y="216" font-family="Arial" font-size="22" fill="#263e5c">advice</text><rect x="560" y="145" width="285" height="145" fill="#fff" stroke="#ccd8e8"/><text x="580" y="188" font-family="Arial" font-size="22" fill="#263e5c">Inspects alternatives</text><rect x="845" y="145" width="285" height="145" fill="#fff" stroke="#ccd8e8"/><text x="865" y="188" font-family="Ari