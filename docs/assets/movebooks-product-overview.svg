<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title description">
<title id="title">MoveBooks AI — Move your books. Keep your confidence.</title>
<desc id="description">Bounded synthetic Beta, provider-neutral reference implementation. Five stages: Understand, Prepare, Move, Verify, Start. AI assists planning, mapping and exception resolution. Deterministic tools verify financial truth; humans approve consequential decisions. Outcome: Verified First Productive Use. Read in order: problem, journey, customer outcome, trust foundation, product family.</desc>
