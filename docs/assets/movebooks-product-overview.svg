<text x="1316" y="358" class="body">Critical accounting decisions require</text>
<text x="1316" y="391" class="body">significant human effort.</text>
<rect x="1906" y="266" width="590" height="144" rx="20" fill="#fff" stroke="#d8e0eb" filter="url(#shadow)"/>
