name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83'
      - run: pip install -e '.[dev,agents]' pip-audit
      - name: Real ADK runner with offline models; no credentials
        run: pytest tests/test_live_reasoning.py -q
      - name: Synthetic reasoning contract catalog (not live quality evidence)
        run: python scripts/live_reasoning_eval.py
      - name: Optional AI dependency audit
        run: pip-audit --skip-editable
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: Fail-closed configuration and reference validation
        run: pytest tests/test_validation_failures.py tests/test_runtime_faults.py -q
      - run: pytest --cov --cov-report=term-missing
      - run: python scripts/repository_checks.py
      - run: git diff --check
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contract"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev,cloud]'
      - name: Real PostgreSQL transactions, concurrency, faults and golden journeys
        run: pytest tests/test_google_runtime.py tests/test_postgres_runtime.py -q
        env:
          MOVEBOOKS_TEST_DATABASE_URL: postgresql+pg8000://contract:ephemeral-ci-only@localhost:5432/contract
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t movebooks-api:validation .
      - run: docker build -f apps/web/Dockerfile -t movebooks-web:validation .
      - name: Full backend suite on the production Python runtime family
        run: |
          docker build --target test -f services/api/Dockerfile -t movebooks-api:test .
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges movebooks-api:test
      - name: Production image smoke and real PostgreSQL container restart journey
        run: python3 scripts/container_smoke.py
  image-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: services/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull --no-cache -f '${{ matrix.dockerfile }}' -t movebooks-image:scan .
      - name: Export image without exposing the Docker socket to the scanner
        run: |
          mkdir -p image-evidence
          docker save movebooks-image:scan -o image-evidence/image.tar
          chmod 644 image-evidence/image.tar
          docker image inspect movebooks-image:scan --format '{{.Id}}' > image-evidence/image-id.txt
          sha256sum image-evidence/image.tar > image-evidence/archive-sha256.txt
      - name: Grype High gate (no ignores or only-fixed filter)
        run: |
          docker run --rm --user=0:0 --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=2g -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            -v "$PWD/image-evidence:/scan:ro" \
            anchore/grype@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3 \
            docker-archive:/scan/image.tar --fail-on high -o json > image-evidence/grype.json
      - name: Retain raw image findings even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ matrix.component }}-${{ github.sha }}
          path: |
            image-evidence/grype.json
            image-evidence/image-id.txt
            image-evidence/archive-sha256.txt
          if-no-files-found: error
          retention-days: 14
